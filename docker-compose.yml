services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.app
    command: uvicorn mega_ai.main:app --host 0.0.0.0 --port 8000 --reload
    env_file:
      - .env.example
    environment:
      DATABASE_URL: postgresql+psycopg://mega_ai:mega_ai@db:5432/mega_ai
      PYTHONPATH: /app/src
    ports:
      - "${API_HOST_PORT:-8000}:8000"
    volumes:
      - .:/app
    depends_on:
      - db

  worker:
    build:
      context: .
      dockerfile: Dockerfile.app
    command: python -m mega_ai.core.tasks.worker
    env_file:
      - .env.example
    environment:
      DATABASE_URL: postgresql+psycopg://mega_ai:mega_ai@db:5432/mega_ai
      PYTHONPATH: /app/src
    volumes:
      - .:/app
    depends_on:
      - db

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: mega_ai
      POSTGRES_PASSWORD: mega_ai
      POSTGRES_DB: mega_ai
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  log_query:
    image: adminer:4
    ports:
      - "${ADMINER_HOST_PORT:-8080}:8080"
    depends_on:
      - db

volumes:
  postgres_data:
